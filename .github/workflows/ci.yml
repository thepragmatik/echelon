name: CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Build and Test
        run: mvn clean verify
      - name: Validate Docker Compose
        run: docker compose -f echelon-docker/docker-compose.yml --profile managers config
      - name: Check shell syntax
        run: bash -n echelon-workers/src/main/resources/scripts/*.sh
      - name: Build docs
        run: |
          pip install mkdocs mkdocs-material
          mkdocs build --strict

  integration:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Validate Docker Compose
        run: docker compose -f echelon-docker/docker-compose.yml --profile managers config
      - name: Integration Tests (Docker)
        run: mvn verify -Pintegration -DrunITs=true -pl echelon-governance

  e2e:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Build
        run: mvn clean package -DskipTests
      - name: E2E Pipeline Test
        run: bash scripts/e2e-test.sh
