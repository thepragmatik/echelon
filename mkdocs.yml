site_name: Echelon
site_description: Hierarchical Docker-based zero-trust agent swarm orchestration
repo_url: https://github.com/thepragmatik/echelon
theme:
  name: material
  palette:
    primary: custom
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  logo: https://raw.githubusercontent.com/thepragmatik/echelon/main/docs/assets/echelon-icon.svg
  favicon: https://raw.githubusercontent.com/thepragmatik/echelon/main/docs/assets/echelon-icon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - header.autohide
    - content.code.copy
    - search.highlight
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - User Guide:
    - Quick Start: user-guide/quickstart.md
    - Architecture Overview: user-guide/architecture.md
    - Governance Model: user-guide/governance.md
    - Running Your First Task: user-guide/first-task.md
    - Review Pipeline: user-guide/review-pipeline.md
    - Security: user-guide/security.md
    - Operations: user-guide/operations.md
  - Architecture:
    - Overview: whitepaper.md
    - "ADR-001: Deontic Tokens": architecture/adr-001-deontic-tokens.md
    - "ADR-002: Redis Budget/Cost": architecture/adr-002-redis-budget-streams.md
    - "ADR-004: Skills Discovery": architecture/adr-004-agent-skills-discovery.md
    - Class Diagram: architecture/governance-class-diagram.md
  - Design:
    - "Agent Skills Discovery": design/agent-skills-discovery.md
  - Research:
    - Governance Synthesis: research/deontic-governance-synthesis.md
    - Roadmap Audit: research/roadmap-audit.md
    - "MVP 3 Plan": research/mvp3-plan.md
    - "OpenShell Analysis": research/openshell-analysis.md
  - Development: developer-guide.md
  - Operations: runbook.md
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
