# Credential isolation policy — Echelon Privacy Router
# Agents never hold their own API keys. All LLM calls go through the router.

scopes:
  builder:
    allowed_providers: [wafer, deepseek]
    max_tokens_per_call: 50000

  reviewer:
    allowed_providers: [wafer, deepseek]
    max_tokens_per_call: 20000

  orchestrator:
    allowed_providers: [wafer, deepseek]
    max_tokens_per_call: 100000

credentials:
  wafer:
    env_var: WAFER_API_KEY
    scope: [builder, reviewer, orchestrator]
  deepseek:
    env_var: DEEPSEEK_API_KEY
    scope: [builder, reviewer, orchestrator]

# Enforcement
# - Router injects credentials based on request origin (X-Echelon-Role header)
# - Router strips credentials from agent-to-router requests
# - Router logs every request with taskId, role, model, tokens, cost
