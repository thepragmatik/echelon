global
  daemon
  maxconn 256
  ssl-server-verify none

defaults
  mode http
  timeout connect 5000ms
  timeout client 50000ms
  timeout server 50000ms

frontend llm-proxy
  bind *:8080
  stats enable
  stats uri /health
  stats hide-version
  stats realm "Echelon Privacy Router"

  # Logging — no syslog target configured; remove log global to avoid warning
  # Logging is handled by Docker container logs

  # L7 Policy ACLs — mapped from DeonticToken actions in agent-types.yaml
  # Implementer: write_source, read_source, run_tests, commit_feature_branch
  acl implementer-role hdr(X-Echelon-Role) -i implementer
  acl implementer-write hdr(X-Echelon-Action) -i write_source commit_feature_branch
  acl implementer-read hdr(X-Echelon-Action) -i read_source run_tests

  # Reviewer: read_source, read_diff, comment_on_pr, approve_pr, request_changes
  acl reviewer-role hdr(X-Echelon-Role) -i reviewer
  acl reviewer-read hdr(X-Echelon-Action) -i read_source read_diff

  # Architect: read_source, read_diff, write_docs, write_adr, approve_pr
  acl architect-role hdr(X-Echelon-Role) -i architect
  acl architect-read hdr(X-Echelon-Action) -i read_source read_diff

  # Orchestrator: read_all, delegate_task, escalate, merge_pr
  acl orchestrator-role hdr(X-Echelon-Role) -i orchestrator
  acl orchestrator-read hdr(X-Echelon-Action) -i read_all

  # Action ACLs for L7 enforcement
  acl action-write_source hdr(X-Echelon-Action) -i write_source
  acl action-merge_pr hdr(X-Echelon-Action) -i merge_pr

  # L7 Policy Enforcement — role-based access control at the HTTP layer
  # Block write_source for non-implementer roles (reviewer, architect, orchestrator)
  http-request deny deny_status 403 content-type "application/json" string '{"error":"forbidden","message":"write_source not permitted for this role"}' if action-write_source !implementer-role

  # Block merge_pr for non-orchestrator roles
  http-request deny deny_status 403 content-type "application/json" string '{"error":"forbidden","message":"merge_pr only permitted for orchestrator"}' if action-merge_pr !orchestrator-role

  # Route LLM calls
  use_backend deepseek if { path_beg /v1/chat/completions } { hdr(X-Provider) -i deepseek }
  use_backend glm if { path_beg /v1/chat/completions } { hdr(X-Provider) -i glm }
  default_backend deepseek

backend deepseek
  server api api.deepseek.com:443 ssl verify none

backend glm
  server api pass.wafer.ai:443 ssl verify none
